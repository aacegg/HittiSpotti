<!doctype html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="robots" content="noindex, nofollow">
<title>Vaikeustasojen arviointi – HittiSpotti</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<style>
  :root {
    --bg: #0c0c0e; --surface: #16161a; --line: #2b2b33; --line-soft: #202027;
    --text: #f4f4f2; --muted: #9b9ba5; --accent: #ffc03a; --accent-ink: #17170f;
    --t1: #4fae7d; --t2: #8fae45; --t3: #d99f2c; --t4: #dd7440; --t5: #cf5252;
    --bad: #ff6b6b;
    --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100dvh; background: var(--bg); color: var(--text);
    font-family: var(--font); font-size: 16px; line-height: 1.5; -webkit-font-smoothing: antialiased;
  }
  button { font: inherit; color: inherit; }
  .wrap { max-width: 560px; margin: 0 auto; padding: 22px 18px 70px; }

  h1 { font-size: 22px; letter-spacing: -.02em; margin: 0 0 4px; }
  .sub { color: var(--muted); font-size: 14px; margin: 0 0 20px; }

  .prog-row {
    display: flex; justify-content: space-between; gap: 12px; font-size: 13px;
    color: var(--muted); font-variant-numeric: tabular-nums; margin-bottom: 6px;
  }
  .prog-row b { color: var(--text); }
  .prog-track { display: block; height: 5px; background: var(--line-soft); border-radius: 3px; overflow: hidden; }
  .prog-bar { display: block; height: 100%; width: 0; background: var(--accent); transition: width .2s ease; }

  .filters { display: flex; flex-wrap: wrap; gap: 6px; margin: 16px 0 0; }
  .fchip {
    padding: 6px 12px; border: 1px solid var(--line); border-radius: 999px;
    background: transparent; color: var(--muted); font-size: 13px; cursor: pointer;
  }
  .fchip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }

  .card {
    margin-top: 18px; padding: 22px 18px; border: 1px solid var(--line);
    border-radius: 14px; background: var(--surface); text-align: center;
  }
  .c-artist { font-size: 14px; color: var(--muted); }
  .c-title { font-size: 24px; font-weight: 700; line-height: 1.15; letter-spacing: -.02em; margin: 3px 0 6px; }
  .c-meta { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .c-guess {
    display: inline-flex; align-items: center; gap: 7px; margin-top: 12px;
    padding: 4px 12px; border-radius: 999px; border: 1px solid var(--line); font-size: 13px; color: var(--muted);
  }
  .c-guess::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--dot, var(--muted)); }

  .play {
    position: relative; display: grid; place-items: center; margin: 18px auto 0;
    width: 104px; height: 104px; border: 0; border-radius: 50%; background: var(--bg); cursor: pointer;
  }
  .play:disabled { opacity: .55; cursor: progress; }
  .ring { position: absolute; inset: 0; width: 100%; height: 100%; transform: rotate(-90deg); }
  .ring circle { fill: none; stroke-width: 4; }
  .ring-bg { stroke: var(--line); }
  .ring-fg { stroke: var(--accent); stroke-linecap: round; stroke-dasharray: 314.16; stroke-dashoffset: 314.16; }
  .play-icon { font-size: 30px; color: var(--accent); margin-left: 4px; }
  .play.is-playing .play-icon { margin-left: 0; font-size: 26px; }
  .play-note { margin-top: 8px; font-size: 13px; color: var(--muted); min-height: 20px; }

  .rate { display: grid; gap: 7px; margin-top: 16px; }
  .rbtn {
    display: flex; align-items: center; gap: 12px; padding: 14px 16px;
    border: 1px solid var(--line); border-radius: 11px; background: var(--surface);
    font-weight: 600; cursor: pointer; text-align: left;
  }
  .rbtn .swatch { width: 13px; height: 13px; border-radius: 50%; background: var(--dot); flex: 0 0 auto; }
  .rbtn .lbl { flex: 1; }
  .rbtn .tag { font-size: 12px; font-weight: 400; color: var(--muted); }
  .rbtn.is-current { background: var(--dot); border-color: var(--dot); color: #16130f; }
  .rbtn.is-current .tag { color: #16130f; opacity: .8; }
  .rbtn[data-t="1"] { --dot: var(--t1); } .rbtn[data-t="2"] { --dot: var(--t2); }
  .rbtn[data-t="3"] { --dot: var(--t3); } .rbtn[data-t="4"] { --dot: var(--t4); }
  .rbtn[data-t="5"] { --dot: var(--t5); }

  .del {
    width: 100%; margin-top: 7px; padding: 13px; border: 1px solid var(--line);
    border-radius: 11px; background: transparent; color: var(--bad); cursor: pointer; font-weight: 600;
  }
  .del.is-current { background: var(--bad); border-color: var(--bad); color: #17170f; }

  .subrow { display: flex; gap: 7px; margin-top: 12px; }
  .sbtn {
    flex: 1; padding: 11px; border: 1px solid var(--line); border-radius: 10px;
    background: transparent; color: var(--muted); font-size: 14px; cursor: pointer;
  }
  .sbtn:disabled { opacity: .35; cursor: not-allowed; }
  .pos { text-align: center; margin-top: 10px; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }

  h2 { font-size: 12px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin: 32px 0 10px; }
  .changes { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
  .changes li {
    display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: baseline;
    padding: 8px 11px; border-radius: 9px; background: var(--surface); font-size: 14px;
  }
  .changes .who { color: var(--muted); font-size: 13px; }
  .changes .move { font-size: 12px; white-space: nowrap; }
  .changes .from { color: var(--muted); text-decoration: line-through; }
  .changes .to { font-weight: 600; }
  .changes .to.rm { color: var(--bad); }
  .empty { color: var(--muted); font-size: 14px; padding: 4px 0; }

  .export { display: flex; gap: 7px; margin-top: 16px; }
  .export button { flex: 1; padding: 12px; border-radius: 10px; border: 1px solid var(--accent); background: var(--accent); color: var(--accent-ink); font-weight: 700; cursor: pointer; }
  .export button.ghost { background: transparent; color: var(--muted); border-color: var(--line); font-weight: 400; }
  pre.out {
    margin: 12px 0 0; padding: 12px; background: var(--surface); border: 1px solid var(--line);
    border-radius: 10px; font-size: 12px; white-space: pre-wrap; word-break: break-all; max-height: 240px; overflow: auto;
  }
  pre.out[hidden] { display: none; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div class="wrap">
  <h1>Vaikeustasojen arviointi</h1>
  <p class="sub">Kuuntele 15 sekunnin pätkä ja anna oma arviosi. Arviot tallentuvat tähän selaimeen automaattisesti.</p>

  <div class="prog-row">
    <span><b id="p-done">0</b> / <span id="p-total">0</span> arvioitu</span>
    <span id="p-changed"></span>
  </div>
  <span class="prog-track"><span class="prog-bar" id="p-bar"></span></span>

  <div class="filters" id="filters" role="group" aria-label="Rajaus"></div>

  <div id="slot"></div>

  <h2>Muutoksesi</h2>
  <ul class="changes" id="changes"></ul>

  <div class="export">
    <button type="button" id="copy-btn">Kopioi arviot</button>
    <button type="button" class="ghost" id="reset-btn">Nollaa</button>
  </div>
  <pre class="out" id="out" hidden></pre>
</div>

<script>
(() => {
  "use strict";
  const NAMES = ["", "Helppo", "Keskitaso", "Vaikea", "Mestari", "Mahdoton"];
  const CLIP = 15;                 // sama pätkän pituus kuin pelin viimeisellä askeleella
  const RING = 2 * Math.PI * 50;
  const LS = "hittispotti-arviot";

  let songs = [], ratings = {}, filter = "todo", idx = 0, history = [];
  const $ = (s) => document.querySelector(s);
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

  /* ---------- Ääni: sama logiikka kuin pelissä ---------- */
  const audio = { ctx: null, buffers: new Map(), starts: new Map(), src: null, raf: 0, playing: false };

  function ensureCtx() {
    if (!audio.ctx) audio.ctx = new (window.AudioContext || window.webkitAudioContext)();
    if (audio.ctx.state === "suspended") audio.ctx.resume();
    return audio.ctx;
  }

  async function refreshPreview(song) {
    const res = await fetch(`https://itunes.apple.com/lookup?id=${song.id}&country=fi`);
    if (!res.ok) throw new Error("lookup " + res.status);
    const hit = ((await res.json()).results || []).find((r) => r.previewUrl);
    if (!hit) throw new Error("ei esikuuntelua");
    song.preview = hit.previewUrl;
    return song.preview;
  }

  async function buffer(song) {
    if (audio.buffers.has(song.id)) return audio.buffers.get(song.id);
    const ctx = ensureCtx();
    const load = async (url) => ctx.decodeAudioData(await (await fetch(url)).arrayBuffer());
    let buf;
    try { buf = await load(song.preview); }
    catch (e) { buf = await load(await refreshPreview(song)); }
    audio.buffers.set(song.id, buf);
    return buf;
  }

  // Ohitetaan hiljaisuus, kuten pelissä, jotta pätkä alkaa samasta kohdasta.
  function audioStart(song, buf) {
    if (audio.starts.has(song.id)) return audio.starts.get(song.id);
    const d = buf.getChannelData(0), sr = buf.sampleRate;
    let peak = 0;
    for (let i = 0; i < d.length; i++) { const v = Math.abs(d[i]); if (v > peak) peak = v; }
    let start = 0;
    if (peak >= 0.005) {
      const thr = Math.max(peak * 0.02, 0.004), win = Math.max(1, Math.round(sr * 0.01));
      for (let i = 0; i + win <= d.length; i += win) {
        let s = 0;
        for (let j = i; j < i + win; j++) s += d[j] * d[j];
        if (Math.sqrt(s / win) >= thr) { start = Math.max(0, i / sr - 0.03); break; }
      }
    }
    audio.starts.set(song.id, start);
    return start;
  }

  function stopAudio() {
    if (audio.src) { try { audio.src.stop(); } catch (e) {} audio.src.disconnect(); audio.src = null; }
    cancelAnimationFrame(audio.raf);
    audio.playing = false;
    const btn = $("#play");
    if (btn) { btn.classList.remove("is-playing"); $("#play-icon").textContent = "▶"; $("#ring-fg").style.strokeDashoffset = RING; }
  }

  async function play(song) {
    stopAudio();
    const btn = $("#play"), icon = $("#play-icon"), note = $("#play-note");
    btn.disabled = true; icon.textContent = "…";
    let buf;
    try { buf = await buffer(song); }
    catch (e) {
      btn.disabled = false; icon.textContent = "▶";
      note.textContent = "Pätkän lataus ei onnistunut.";
      return;
    }
    if (!current() || current().id !== song.id) return;
    btn.disabled = false;
    const ctx = ensureCtx(), src = ctx.createBufferSource(), gain = ctx.createGain(), now = ctx.currentTime;
    src.buffer = buf;
    gain.gain.setValueAtTime(0, now);
    gain.gain.linearRampToValueAtTime(1, now + 0.02);
    gain.gain.setValueAtTime(1, now + CLIP - 0.05);
    gain.gain.linearRampToValueAtTime(0, now + CLIP);
    src.connect(gain).connect(ctx.destination);
    src.start(now, audioStart(song, buf), CLIP);
    audio.src = src; audio.playing = true;
    btn.classList.add("is-playing"); icon.textContent = "■";
    note.textContent = "";
    const t0 = performance.now();
    const tick = () => {
      const t = Math.min(1, (performance.now() - t0) / (CLIP * 1000));
      $("#ring-fg").style.strokeDashoffset = RING * (1 - t);
      if (t < 1) audio.raf = requestAnimationFrame(tick); else stopAudio();
    };
    audio.raf = requestAnimationFrame(tick);
  }

  /* ---------- Tila ---------- */
  const save = () => { try { localStorage.setItem(LS, JSON.stringify(ratings)); } catch (e) {} };
  const queue = () => {
    if (filter === "all") return songs;
    if (filter === "todo") return songs.filter((s) => ratings[s.id] === undefined);
    return songs.filter((s) => String(s.tier) === filter);
  };
  const current = () => queue()[idx];

  function set(id, val) {
    history.push({ id, prev: ratings[id] });
    if (history.length > 60) history.shift();
    ratings[id] = val;
    save();
    if (filter !== "todo") idx += 1;   // "todo" pudottaa biisin listalta itsestään
    stopAudio();
    render();
  }

  function undo() {
    const last = history.pop();
    if (!last) return;
    if (last.prev === undefined) delete ratings[last.id]; else ratings[last.id] = last.prev;
    save(); render();
  }

  /* ---------- Näkymä ---------- */
  function render() {
    const q = queue();
    if (idx >= q.length) idx = Math.max(0, q.length - 1);
    const done = songs.filter((s) => ratings[s.id] !== undefined).length;
    const changed = songs.filter((s) => ratings[s.id] !== undefined && ratings[s.id] !== s.tier).length;
    $("#p-done").textContent = done;
    $("#p-total").textContent = songs.length;
    $("#p-changed").textContent = changed + (changed === 1 ? " muutos" : " muutosta");
    $("#p-bar").style.width = (songs.length ? done / songs.length * 100 : 0).toFixed(1) + "%";

    const slot = $("#slot");
    if (!q.length) {
      slot.innerHTML = `<div class="card"><p class="c-title">Ei käytäviä biisejä</p>
        <p class="c-meta">${filter === "todo" ? "Kaikki on arvioitu." : "Tällä rajauksella ei ole biisejä."}</p></div>`;
      renderChanges();
      return;
    }
    const s = q[idx], mine = ratings[s.id];
    slot.innerHTML = `
      <div class="card">
        <p class="c-artist">${esc(s.artist)}</p>
        <p class="c-title">${esc(s.title)}</p>
        <p class="c-meta">${s.year}</p>
        <span class="c-guess" style="--dot: var(--t${s.tier})">Arvioni: ${NAMES[s.tier]}</span>
        <button type="button" class="play" id="play" aria-label="Kuuntele 15 sekuntia">
          <svg class="ring" viewBox="0 0 108 108" aria-hidden="true">
            <circle class="ring-bg" cx="54" cy="54" r="50"></circle>
            <circle class="ring-fg" id="ring-fg" cx="54" cy="54" r="50"></circle>
          </svg>
          <span class="play-icon" id="play-icon" aria-hidden="true">▶</span>
        </button>
        <p class="play-note" id="play-note">15 sekuntia</p>
      </div>
      <div class="rate" id="rate">
        ${[1, 2, 3, 4, 5].map((t) => `
          <button type="button" class="rbtn${mine === t ? " is-current" : ""}" data-t="${t}">
            <span class="swatch"></span><span class="lbl">${NAMES[t]}</span>
            <span class="tag">${t === s.tier ? "arvioni" : ""}</span>
          </button>`).join("")}
      </div>
      <button type="button" class="del${mine === "x" ? " is-current" : ""}" id="del-btn">Poista pelistä</button>
      <div class="subrow">
        <button type="button" class="sbtn" id="prev"${idx === 0 ? " disabled" : ""}>← Edellinen</button>
        <button type="button" class="sbtn" id="undo"${history.length ? "" : " disabled"}>Kumoa</button>
        <button type="button" class="sbtn" id="skip">Ohita →</button>
      </div>
      <p class="pos">${idx + 1} / ${q.length}</p>`;

    $("#play").addEventListener("click", () => (audio.playing ? stopAudio() : play(s)));
    $("#rate").addEventListener("click", (e) => {
      const b = e.target.closest(".rbtn");
      if (b) set(s.id, Number(b.dataset.t));
    });
    $("#del-btn").addEventListener("click", () => set(s.id, "x"));
    $("#prev").addEventListener("click", () => { idx = Math.max(0, idx - 1); stopAudio(); render(); });
    $("#skip").addEventListener("click", () => { idx += 1; stopAudio(); render(); });
    $("#undo").addEventListener("click", undo);
    renderChanges();
  }

  function renderChanges() {
    const list = songs.filter((s) => ratings[s.id] !== undefined && ratings[s.id] !== s.tier);
    const el = $("#changes");
    el.innerHTML = list.length
      ? list.map((s) => {
          const v = ratings[s.id];
          const to = v === "x" ? `<span class="to rm">poista</span>` : `<span class="to">${NAMES[v]}</span>`;
          return `<li><span><span class="who">${esc(s.artist)} · </span>${esc(s.title)}</span>
            <span class="move"><span class="from">${NAMES[s.tier]}</span> → ${to}</span></li>`;
        }).join("")
      : `<li class="empty">Et ole vielä muuttanut yhtään arviota.</li>`;
  }

  /* ---------- Suodattimet ja vienti ---------- */
  const FILTERS = [["todo", "Arvioimattomat"], ["all", "Kaikki"], ["1", "Helppo"], ["2", "Keskitaso"], ["3", "Vaikea"], ["4", "Mestari"], ["5", "Mahdoton"]];
  $("#filters").innerHTML = FILTERS.map(([v, l]) =>
    `<button type="button" class="fchip" data-f="${v}" aria-pressed="${v === filter}">${l}</button>`).join("");
  $("#filters").addEventListener("click", (e) => {
    const b = e.target.closest(".fchip");
    if (!b) return;
    filter = b.dataset.f; idx = 0; stopAudio();
    $("#filters").querySelectorAll(".fchip").forEach((c) => c.setAttribute("aria-pressed", String(c.dataset.f === filter)));
    render();
  });

  $("#copy-btn").addEventListener("click", async () => {
    const changed = {};
    songs.forEach((s) => { if (ratings[s.id] !== undefined && ratings[s.id] !== s.tier) changed[s.id] = ratings[s.id]; });
    const text = JSON.stringify(changed);
    $("#out").textContent = text;
    $("#out").hidden = false;
    try { await navigator.clipboard.writeText(text); $("#copy-btn").textContent = "Kopioitu!"; }
    catch (e) { $("#copy-btn").textContent = "Kopioi teksti alta"; }
    setTimeout(() => { $("#copy-btn").textContent = "Kopioi arviot"; }, 2500);
  });

  $("#reset-btn").addEventListener("click", () => {
    if (!confirm("Nollataanko kaikki antamasi arviot?")) return;
    ratings = {}; history = []; save(); $("#out").hidden = true; render();
  });

  /* ---------- Käynnistys ---------- */
  try { ratings = JSON.parse(localStorage.getItem(LS) || "{}") || {}; } catch (e) { ratings = {}; }

  fetch("songs.json", { cache: "no-cache" })
    .then((r) => r.json())
    .then((all) => { songs = all.filter((s) => s.id && s.preview); render(); })
    .catch(() => { $("#slot").innerHTML = `<div class="card"><p class="c-meta">Biisien lataus epäonnistui.</p></div>`; });
})();
</script>
</body>
</html>
