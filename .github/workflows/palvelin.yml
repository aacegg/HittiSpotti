# Julkaisee tilastopalvelimen (palvelin/index.js) Cloudflaren Workeriksi.
#
# Oma tiedostonsa eikä osa julkaise.yml:ää, koska nämä ovat eri asioita:
# julkaise.yml vie sivuston staattiset tiedostot, tämä vie Workerin jossa
# on D1-sidonta. Yhdessä tiedostossa toisen kaatuminen estäisi toisen,
# vaikka sivusto toimii ilman palvelinta ja palvelin ilman sivustoa.
#
# Liipaisin on polkurajattu: tämä ei aja jokaisella julkaisulla vaan vain
# silloin kun palvelimen koodi on oikeasti muuttunut. Turha uudelleenjulkaisu
# ei riko mitään, mutta se sotkisi lokin josta pitää nähdä milloin palvelin
# viimeksi vaihtui.
#
# Vaatii repon asetuksissa (Settings -> Secrets and variables -> Actions)
# tasan samat kaksi salaisuutta kuin julkaise.yml, ei yhtään uutta:
#   CLOUDFLARE_API_TOKEN   malli "Edit Cloudflare Workers"
#   CLOUDFLARE_ACCOUNT_ID
#
# Tietokannan id ei ole kummassakaan eikä wrangler.tomlissa, koska repo on
# julkinen. Se haetaan ajossa Cloudflaren rajapinnasta tietokannan nimellä,
# samalla tunnuksella jolla julkaisu joka tapauksessa tehdään. Id on siis
# johdettavissa siitä mitä tässä jo on, eikä sitä tarvitse tallettaa
# kolmanteen paikkaan josta se voi vanhentua.
#
# Jos tunnukselta puuttuu D1:n lukuoikeus, haku kaatuu ja sen voi ohittaa
# lisäämällä salaisuuden CLOUDFLARE_D1_ID (Cloudflare -> D1 -> hittispotti
# -> Database ID). Silloin rajapintaa ei kutsuta lainkaan.
name: Julkaise palvelin

on:
  push:
    branches: [main]
    paths:
      - "palvelin/**"
      - ".github/workflows/palvelin.yml"
  # Käsiajo: tällä voi uusia epäonnistuneen ajon tai julkaista palvelimen
  # ilman että palvelimen koodiin tarvitsee koskea. Näkyy GitHubin
  # Actions-välilehdellä vasta kun tämä tiedosto on mainissa.
  workflow_dispatch:

concurrency:
  group: palvelin
  cancel-in-progress: true

jobs:
  palvelin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # wrangler.tomlissa on paikanvaraaja, koska oikea id ei kuulu
      # julkiseen repoon. Korvaus tehdään vasta ajossa, eikä muutos päädy
      # mihinkään: ajo saa oman kertakäyttöisen kopion puusta.
      #
      # Id haetaan nimellä rajapinnasta, jotta sitä ei tarvitse tallettaa
      # käsin mihinkään. Tietokannan nimi luetaan wrangler.tomlista eikä
      # kirjoiteta tähän, jotta nimen vaihtuessa ei ole kahta totuutta.
      #
      # Id ei ole salaisuus samalla tavalla kuin tunnus, mutta se piilotetaan
      # lokista silti: julkisen repon ajolokit näkyvät kaikille, eikä tilin
      # sisäisiä tunnisteita ole syytä julkaista ilman hyötyä.
      - name: Aseta tietokannan id
        env:
          TUNNUS: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TILI: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_ID: ${{ secrets.CLOUDFLARE_D1_ID }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib, re, sys, urllib.request

          toml = pathlib.Path("palvelin/wrangler.toml")
          teksti = toml.read_text(encoding="utf-8")
          if "TÄYTÄ_TÄHÄN" not in teksti:
              sys.exit("wrangler.tomlissa ei ole paikanvaraajaa, tarkista tiedosto")

          nimi = re.search(r'^database_name\s*=\s*"([^"]+)"', teksti, re.M)
          if not nimi:
              sys.exit("wrangler.tomlista ei löydy database_namea")
          nimi = nimi.group(1)

          tunnus = os.environ["D1_ID"].strip()
          if not tunnus:
              tili = os.environ["TILI"]
              osoite = (f"https://api.cloudflare.com/client/v4/accounts/{tili}"
                        f"/d1/database?name={nimi}")
              pyynto = urllib.request.Request(
                  osoite, headers={"Authorization": "Bearer " + os.environ["TUNNUS"]})
              try:
                  with urllib.request.urlopen(pyynto, timeout=30) as v:
                      data = json.load(v)
              except Exception as e:
                  sys.exit(f"D1-haku epäonnistui ({e}). Jos tunnukselta puuttuu D1:n "
                           f"lukuoikeus, lisää salaisuus CLOUDFLARE_D1_ID.")
              osumat = [d for d in data.get("result") or [] if d.get("name") == nimi]
              if len(osumat) != 1:
                  sys.exit(f"Tietokantaa {nimi} ei löytynyt yksikäsitteisesti "
                           f"({len(osumat)} osumaa).")
              tunnus = osumat[0]["uuid"]

          print(f"::add-mask::{tunnus}")
          toml.write_text(teksti.replace("TÄYTÄ_TÄHÄN", tunnus), encoding="utf-8")
          print(f"Tietokanta {nimi} sidottu.")
          PY

      - name: Julkaise Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: palvelin
          wranglerVersion: "4"
          command: deploy
