# Julkaisee hittispotti.fi:n Cloudflarelle kun mainiin tulee uutta.
#
# Julkaisutapa pysyy samana kuin GitHub Pagesilla: mainiin työntäminen on
# julkaisu, eikä mitään muuta komentoa tarvita.
#
# Miksi tämä eikä wrangler deploy omalta koneelta: wrangler lataa
# TYÖHAKEMISTON, ei gitin sisältöä. Pages julkaisi vain sen mikä oli
# haarassa, joten gitignoratut työtiedostot eivät voineet vuotaa.
# Käsin ajettuna ne voisivat. actions/checkout antaa puhtaan puun, jossa
# niitä ei ole olemassa.
#
# Vaatii kaksi salaisuutta repon asetuksissa (Settings -> Secrets and
# variables -> Actions):
#   CLOUDFLARE_API_TOKEN   malli "Edit Cloudflare Workers"
#   CLOUDFLARE_ACCOUNT_ID
name: Julkaise

on:
  # Mainiin työntäminen on julkaisu, kuten se oli GitHub Pagesillakin.
  # Liipaisin oli siirron ajan pelkkä workflow_dispatch, koska salaisuuksia
  # ei ollut vielä asetettu ja jokainen push olisi tuottanut punaisen ajon.
  push:
    branches: [main]
  # Käsiajo jää rinnalle: sillä voi uusia epäonnistuneen ajon ilman että
  # tarvitsee keksiä uusi commit.
  workflow_dispatch:

# Kaksi yhtäaikaista julkaisua kirjoittaisi toistensa päälle
# sattumanvaraisessa järjestyksessä. Uusin voittaa, vanha keskeytetään.
concurrency:
  group: julkaise
  cancel-in-progress: true

jobs:
  julkaise:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Kokoa julkaistava hakemisto
        # dist/ kootaan git archivella, eli siinä on TASAN ne tiedostot
        # jotka git tuntee. Tämä on tahallaan allowlist eikä poissulkulista:
        # wrangler julkaisee työhakemiston, ja poissulkulista on aina
        # askeleen jäljessä sitä mitä hakemistoon ilmestyy. Mitattuna
        # juuresta julkaistaessa mukaan lähti ensin gitignorattu
        # puuttuvat-biisit.txt ja sen jälkeen julkaisutoiminnon oma
        # node_modules, jossa on 126 MiB:n binääri.
        #
        # Poistettavat luetaan _config.yml:stä, jotta Pagesin ja
        # Cloudflaren tarjoama tiedostojoukko pysyy samana yhdestä
        # lähteestä eikä kahta listaa tarvitse pitää käsin synkassa.
        run: |
          mkdir dist
          git archive HEAD | tar -x -C dist
          python3 - <<'PY'
          import shutil, sys
          from pathlib import Path
          import re

          teksti = Path("_config.yml").read_text(encoding="utf-8")
          poista = re.findall(r"^\s*-\s+(\S+)\s*$", teksti, flags=re.M)
          # CNAME oli Pagesin tapa kertoa verkkotunnus. Cloudflarella se
          # asetetaan Workerin asetuksista, joten tiedostoa ei tarjota.
          poista.append("CNAME")

          for nimi in poista:
              kohde = Path("dist") / nimi.rstrip("/")
              if kohde.is_dir():
                  shutil.rmtree(kohde)
              elif kohde.exists():
                  kohde.unlink()

          # Sama sääntö kuin Jekyllillä: pisteellä tai alaviivalla alkavaa
          # ei julkaista. Tämä pitää Cloudflaren tarjoaman joukon samana
          # kuin Pagesin ilman että tiedostoja tarvitsee luetella nimeltä.
          # Kattaa _config.yml:n, .gitignoren, .githubin ja kaiken mitä
          # repoon jatkossa lisätään samalla nimeämistavalla.
          for kohde in sorted(Path("dist").rglob("*"), key=lambda p: -len(p.parts)):
              if kohde.name.startswith((".", "_")):
                  shutil.rmtree(kohde) if kohde.is_dir() else kohde.unlink()

          tiedostot = [p for p in Path("dist").rglob("*") if p.is_file()]
          print(f"dist/: {len(tiedostot)} tiedostoa")
          iso = [p for p in tiedostot if p.stat().st_size > 25 * 1024 * 1024]
          if iso:
              print("Yli 25 MiB, Cloudflare hylkäisi:", *iso, sep="\n  ")
              sys.exit(1)
          PY

      - name: Julkaise Cloudflarelle
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Pakollinen. Ilman tätä toiminto asentaa oman oletuksensa
          # wrangler 3.90.0, joka ei ymmärrä pelkkiä staattisia tiedostoja
          # ilman Worker-skriptiä ja kaatuu virheeseen "Missing entry-point:
          # ... or the `main` config field". Tässä sivustossa ei ole
          # skriptiä lainkaan, joten main puuttuu tarkoituksella ja
          # wranglerin on oltava 4.
          wranglerVersion: "4"
