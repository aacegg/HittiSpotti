<!doctype html>
<html lang="fi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <title>Sivua ei löytynyt – HittiSpotti</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <!-- Ilman ?v=-versiota tarkoituksella: virhesivu on omavarainen eikä sitä
       julkaista muun aineiston mukana, joten versionumero jäisi jälkeen.
       Näin kävikin: se osoitti pitkään versioon 41 muun ollessa 60. -->
  <link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">
  <style>
    /* Sama paletti ja ladonta kuin pelissä, mutta omavaraisena: virhesivun ei
       kuulu jäädä lataamatta siksi, että jokin muu tiedosto puuttuu. Kirjasimet
       ladataan, jos ne löytyvät, muuten varakirjasimet. */
    @font-face { font-family: "Bricolage Grotesque"; font-weight: 400 800; font-display: swap; src: url("/fonts/bricolage-latin.woff2") format("woff2"); }
    :root { color-scheme: dark; --bg:#0a0908; --text:#f2ebdf; --muted:#8a8073; }
    @media (prefers-color-scheme: light) { :root { color-scheme: light; --bg:#faf7f2; --text:#1c1814; --muted:#6b6155; } }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100dvh; display: grid; place-items: center;
      padding: 24px; background: var(--bg); color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      font-size: 16px; line-height: 1.5; text-align: center; font-synthesis: none;
    }
    main { max-width: 380px; }
    .merkki { display: inline-block; margin-bottom: 24px; font-family: "Bricolage Grotesque", system-ui, sans-serif; font-size: 24px; font-weight: 700; }
    .merkki em { font-style: normal; }
    h1 { margin: 0 0 8px; font-family: "Bricolage Grotesque", system-ui, sans-serif; font-size: 36px; font-weight: 700; line-height: 1.05; }
    p { margin: 0 0 24px; color: var(--muted); }
    a.btn {
      display: inline-block; padding: 14px 28px; border-radius: 10px;
      background: var(--text); color: var(--bg); font-weight: 800; text-decoration: none;
    }
  </style>
</head>
<body>
  <main>
    <span class="merkki">Hitti<em>Spotti</em></span>
    <h1>Sivua ei löytynyt</h1>
    <p>Osoite meni jotenkin väärin. Päivän biisit odottavat silti.</p>
    <a class="btn" href="/">Pelaamaan</a>
  </main>
</body>
</html>
